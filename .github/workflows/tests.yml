name: tests

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: npm install
      - name: Run the linter
        run: npm run lint
      - name: Run the tests
        run: npm test
        env:
          CI: true
